# What the staging cluster runs, committed so the deploy is reproducible from the repository.
#
#   helm upgrade docket ./helm -n platform -f helm/values-staging.yaml --set image.digest=sha256:…
#
# Stays ClusterIP: docket is reached by console-docket's server and by authenticated staff through
# the cluster ingress, not as a public VIP of its own.

service:
  # THE VIP THE EDGE PROXIES TO for `/api/docket` on each tenant's canonical host (ADR-0126,
  # ADR-0121 D2): the API each tenant's console and the remote CLI call (ADR-0127, ADR-0097). There
  # is no ingress controller: Cilium announces this address over L2 from the pool in
  # address-registry.yaml, which records the pool, not the assignment, so the edge inventory names
  # whatever address the cluster gave. Every route but /api/health demands a token, so exposing the
  # service exposes nothing unauthenticated.
  type: LoadBalancer

imagePullSecrets:
  - name: ghcr

# Non-secret OIDC/tenant config for the serve binary, plus the database URL from a Secret. The
# audience is the paridyum-operations project id (`make zitadel-apps`) — a token for any other
# project is correctly rejected (wrong_audience), which is the ADR-0092 boundary. DOCKET_OIDC_JWKS
# is omitted so the binary derives {issuer}/oauth/v2/keys, which is the Zitadel default.
env:
  - name: DOCKET_ROOT
    value: "/app"
  - name: DOCKET_STORE
    value: "/var/lib/docket/store"
  - name: DOCKET_OIDC_ISSUER
    value: "https://id.paridyum.com"
  - name: DOCKET_OIDC_AUDIENCE
    value: "392754455717610538"   # paridyum-operations, control-plane instance (rebuilt 2026-09-28, ADR-0123)
  # A tenant's own members' tokens, relayed by the tenant console (ADR-0127 D2): verified against the tenant
  # instance's keys, audienced for that tenant's docket project, which the forwarded host names.
  - name: DOCKET_TENANT_ISSUER
    value: "https://auth.paridyum.com"
  - name: DOCKET_TENANT_ID
    value: "451ce2e0-b82f-59ad-ad54-ab02ad9811cb"   # Paridyum's tenant (tenant zero), rebuilt 2026-09-28
  - name: PARIDYUM_REGION
    value: "in"   # on every audit event; serve refuses to start without it (ADR-0044 D6)
  - name: DOCKET_DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: docket
        key: database_url
  # Issued documents go to Garage, not the pod (ADR-0094, D-76). With DOCKET_S3_ENDPOINT set, the
  # blob store is S3; without it, a PDF lives only as long as the pod. `docket-s3` comes from SOPS
  # through `make garage-consumer-secrets` in infra-kubernetes.
  - name: DOCKET_S3_ENDPOINT
    valueFrom: { secretKeyRef: { name: docket-s3, key: endpoint } }
  - name: DOCKET_S3_BUCKET
    valueFrom: { secretKeyRef: { name: docket-s3, key: bucket } }
  - name: DOCKET_S3_REGION
    valueFrom: { secretKeyRef: { name: docket-s3, key: region } }
  - name: DOCKET_S3_ACCESS_KEY_ID
    valueFrom: { secretKeyRef: { name: docket-s3, key: access_key_id } }
  - name: DOCKET_S3_SECRET_ACCESS_KEY
    valueFrom: { secretKeyRef: { name: docket-s3, key: secret_access_key } }
