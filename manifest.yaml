# Schema: knowledge/manifest.schema.json
#
# lifecycle: beta — the code is complete and reviewed to the standard it
# will be operated at (C-0010), but it has not yet issued a document that
# anyone has signed. It becomes `production` on the first real issuance.
#
# NOT `alpha`. That value is not in the schema's enum, which permits only
