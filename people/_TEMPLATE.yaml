# One person. Create with `docket new <slug> <class>`, then fill this in.
#
# EVERY `FILL-ME` MUST BE REPLACED. `docket check` reports each one as an error
# and `docket issue` refuses outright, because a record that has not been filled
# in satisfies every structural rule and looks complete.
#
# This template used to ship realistic example values, and that was a defect: two
# freshly enrolled interns both displayed as the same person and nothing flagged
# it. A plausible placeholder cannot be distinguished from real data by anything
# except someone noticing.
#
# Values NOT marked FILL-ME are organisation defaults -- class, stage, department,
# supervisor, work arrangement, device type. Change them where they are wrong;
# they are not personal data and they are safe to leave.
#
# people/ is GITIGNORED. Personal data must not enter git: history cannot be
# erased, which would make DPDP erasure rights unhonourable.
#
# EVERY FIELD BELOW IS DECLARED IN registry/fields.yaml WITH A STATED
# PURPOSE. A field that is not declared there is rejected by `docket check`,
# and a field your person class does not permit is rejected too. That is not
# pedantry: collecting personal data with no purpose is what the DPDP Act's
# purpose limitation forbids.
version: 1

engagement:
  class: intern                          # intern | employee | contractor
  stage: preboarding                     # offered | preboarding | active | offboarding | alumni
  role: FILL-ME
  department: Platform Engineering
  supervisor: ROHAN BATRA
  work_arrangement: Remote               # Remote | Hybrid | On-site
  hours_per_week: 20
  start_date: FILL-ME
  end_date: FILL-ME                      # required: unpaid must be time-bound
  project_description: FILL-ME

identity:
  legal_name: FILL-ME
  preferred_name: FILL-ME
  # Never inferred from a name. Defaults to they/them when omitted.
  pronouns:
    subject: they
    object: them
    possessive: their
  # REQUIRED. The DPDP Act defines a child as anyone under eighteen (s2(f))
  # and s9 requires verifiable guardian consent before processing a child's
  # data at all. Without this field Paridyum cannot tell whether that applies.
  date_of_birth: FILL-ME

# Only where the intern is under eighteen on their start date. Leave the
# whole block out otherwise -- `docket check` reports it as over-collection.
# guardian:
#   name: ...
#   relationship: Parent
#   email: ...
#   phone: ...

contact:
  email: FILL-ME
  phone: FILL-ME
  address: FILL-ME

education:
  institution: FILL-ME
  degree: FILL-ME
  specialization: FILL-ME
  graduation_year: FILL-ME
  email: FILL-ME
  # THE field the unpaid basis rests on. Issuance is refused without it.
  currently_enrolled: true
  academic_credit: true
  institution_requires_noc: true
  institution_requires_certificate: true

professional:
  linkedin: FILL-ME
  github: FILL-ME
  skills: FILL-ME

device:
  type: Personal Laptop                  # Personal Laptop | Paridyum-Provided
  os: Linux

access:
  company_email: null
  systems: null                          # recorded as events, not edited here

equipment:
  issued: false
  device: null
  serial: null

# NOT COLLECTED FOR AN INTERN, and `docket check` will refuse them:
#   statutory:      PAN, Aadhaar, UAN, ESIC, bank account
#   compensation:   salary
# No statute requires them for an unpaid student placement.

# ---- document content -------------------------------------------------
# What the certificate and reference letter actually say. Not personal data
# so much as work product, but it lives with the record because it is about
# this person's internship.

certificate:
  areas:
    - FILL-ME

reference:
  requested: false
  contributions:
    - FILL-ME
  qualities: FILL-ME
  specific_strength: FILL-ME

pre_existing_ip: None
