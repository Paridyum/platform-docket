  - check: repo.hooks_are_reachable
    spec: >
      Fails when neither channel will load hooks: the paridyum marketplace is absent from
      ~/.claude/plugins/known_marketplaces.json AND .claude/settings.json registers no PreToolUse
      and Stop hooks whose paths exist and are executable.
    owner: check-repo.sh
    blocks: [ADR-0027]
    declared: 2026-08-07
    frameworks:
      ssdf: ["PO.3.2"]
    notes: >
      REPLACES A CHECK THAT PROVED NOTHING. repo.enables_paridyum_platform_plugin verifies the
      plugin is DECLARED in a config file, passed for the life of the repository, and concealed a
      total enforcement failure: the marketplace had never been added, so ADR-0007 layer 1 had never
      denied an edit, the SessionStart context had never been injected, and the ADR-0025 Stop hook
      had never fired once — every checkpoint commit that day was invoked by hand. A config file is a
      statement of intent.
      Checks EXECUTABILITY, not just registration. ADR-0022 had already found a hook registered and
      not executable: configured, silent, and indistinguishable from working. Registration alone
      would have reproduced that one level in.
      `error`, unlike repo.paridyum_plugin_is_installed's warning, because this is a repository
      property rather than machine state: a repo holding the hooks can always register them, and one
      where neither channel exists has layer 1 and durability both structurally off.
      Necessary, not sufficient: whether a session actually LOADED a registered hook is Claude Code
      state and no file can answer it. ADR-0027 cost 2 records that limit.

