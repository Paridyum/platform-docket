  - check: repo.claude_md_links_resolve
    spec: >
      Fails when a relative markdown link in CLAUDE.md names a path that does not exist, or when
      a skill named in CLAUDE.md has no SKILL.md in the plugin.
    owner: check-repo.sh
    blocks: [ADR-0026]
    declared: 2026-08-07
    notes: >
      CLAUDE.md became a router rather than a manual: it holds the rules needed to choose a route
      plus the ones whose violation is destructive, and everything else is one hop away. That
      makes link integrity a correctness property rather than tidiness.
      A router with a dangling edge is WORSE than no router. An agent follows the link, finds
      nothing, and falls back to inferring — which is the single failure "never infer, retrieve"
      exists to prevent. The entrypoint would then be actively causing the behaviour it forbids.
      Skills are checked by a different rule from paths, because the harness resolves them by name
      (ADR-0007) and there is no path in the text to verify. Only checked where the plugin is
      present, since a consuming repository has the skills from the marketplace rather than on
      disk.
      `blocks` names ADR-0026 alone. The check belongs most naturally to ADR-0007, which is
      `locked` and cannot gain an `enforced_by` entry without being superseded — so ADR-0026 was
      written partly to give it an attributable home. knowledge.orphan_check_declarations is what
      forced that to be resolved rather than left as a blocks list nothing matched.
      HTTP links are deliberately unchecked: somebody else's uptime is not a property this gate
      can assert, and a network call in a pre-commit hook is a hook people bypass.

  - check: repo.claude_md_under_line_budget
    spec: >
      Fails when the root CLAUDE.md exceeds `max_lines` lines.
    owner: check-repo.sh
    blocks: [ADR-0007, ADR-0026]
    declared: 2026-08-06
    notes: >
      ADR-0007 sets max_lines 200. This repository's CLAUDE.md should be measured
      against it before the check ships — a gate its own author violates does not
      survive first contact.

    resolution:
      severity: error
      args: { max_lines: 200 }
      citers: [ADR-0007, ADR-0026]
      recorded: 2026-08-08
      reasoning: >
        ADR-0036 §4. Two locked artifacts cite this check and disagree. Severity from ADR-0026
        (stricter, and the artifact specifically about CLAUDE.md's shape); threshold from
        ADR-0007, whose `args: { max_lines: 200 }` is the ONLY threshold any artifact has ever
        declared. ADR-0026's "150-line budget" lives in prose, and check-repo.sh had been
        reading it as a parameter — enforcing 150, which no `enforced_by` anywhere requested.
        Neither artifact is superseded and neither loses a word.
