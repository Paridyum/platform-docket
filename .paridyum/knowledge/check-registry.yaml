  - check: repo.entrypoint_does_not_restate_standards
    spec: >
      Fails when ten or more consecutive words of non-quoted prose in CLAUDE.md also appear in a
      file under standards/ or constitution/.
    owner: check-repo.sh
    blocks: [ADR-0026]
    declared: 2026-08-07
    notes: >
      THE GUARD THE OTHER TWO WERE MISSING. repo.claude_md_links_resolve catches a dead route and
      repo.claude_md_under_line_budget catches growth, but a router decays by somebody inlining a
      SUMMARY of a standard — which fits inside 150 lines and leaves every link resolving. That is
      the failure ADR-0026 exists to prevent, and for its first hours nothing detected it.
      It found two real instances in the router on its first run, in a file written that same hour
      specifically to be a router: a restatement of STD-0005's reasoning outside the mandated
      blockquote, and a near-verbatim copy of C-0006's sentence about a fired trigger. Rules are
      hard to not restate, which is the argument for checking rather than intending.
      Word shingles, not line diffing: a copy that has been rewrapped or lightly edited is still a
      copy, and line comparison misses it.
      BLOCKQUOTES ARE EXEMPT, and that is what makes the rule expressible without an exception
      list. STD-0005 requires the changelog brief be reproduced in CLAUDE.md; it is a blockquote
      there, so "quote it or link it" legalises the mandated case by its shape rather than by name.
      `adr/` is deliberately NOT compared, and that was measured rather than assumed. ADR-0022,
      ADR-0025 and ADR-0026 all quote CLAUDE.md rather than the reverse — an ADR about the harness
      legitimately describes the entrypoint — and comparing against adr/ produced three false
      positives on the first run.
      N=10 is loose on purpose: the entrypoint was clean at N=8 when this was written, so
      tightening it is a one-line change with evidence behind it rather than a guess.

  - check: repo.git_remote_configured
    spec: >
      Fails when a git checkout has no configured remote.
    owner: check-repo.sh
    blocks: [ADR-0025, ADR-0043]
    declared: 2026-08-07
    notes: >
      The smallest check in this registry and among the most valuable. A commit on one disk is
      still on one disk, and one disk is what failed — ADR-0025 exists because work in this
      repository was lost locally, and DECISION-DEBT.md reported the one-disk state accurately
      for a day while nothing happened. The ledger reminded; nothing enforced.
      Deliberately not satisfied by "a remote is reachable". Reachability is a network property
      and would make this flaky offline, which is how a check gets ignored. Configuration is
      what can be checked locally and is what was actually missing.

