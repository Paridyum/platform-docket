    owner: check-knowledge.sh
    blocks: [ADR-0011]
    declared: 2026-08-06
    notes: >
      Must exclude DECISION-DEBT.md. The ledger reports dangling ids by citing them,
      so scanning it makes the check self-inflicting and permanently red — the
      reasoning is written out at length in check-knowledge.sh section 2.
      Reporting gap, now fixed: the implementation named only the FIRST citing file,
      so a widely-cited typo looked like one occurrence. It now names all of them.
      Known limitation with no clean fix: an id used ILLUSTRATIVELY in prose is
      indistinguishable from a real citation, so writing `ANTI-0001` or `REQ-0007` as an
      example fails the check. This caught RFC-0002 and the decompose-spec skill within
      an hour of each other. The convention is to write `REQ-NNNN` in examples. A smarter
      check would need to understand prose context, which is not worth it — the false
      positive is loud, instant and trivially fixed, which is the right failure direction.

  - check: repo.no_inline_scan_suppressions
    spec: >
      Fails when a tracked file contains an inline secret-scan suppression comment —
      `gitleaks:allow` or `infisical-scan:ignore`.
    owner: infra-ci
    blocks: [ADR-0017]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PO.4.2"]
      csf: ["GV.OV"]
    notes: >
      Implemented in secret-scan.sh, so all three layers inherit it. Complements
      rather than duplicates --ignore-gitleaks-allow: the flag makes the comment
      ineffective, this makes it absent, and a stale comment left in the tree becomes
      a live bypass the moment someone drops the flag. Excludes *.md, .gitleaksignore
