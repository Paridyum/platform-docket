  - check: repo.paridyum_plugin_is_installed
    spec: >
      Fails when ~/.claude/plugins/known_marketplaces.json does not name the paridyum marketplace
      on a machine that has a ~/.claude directory.
    owner: check-repo.sh
    blocks: [ADR-0007]
    declared: 2026-08-07
    frameworks:
      ssdf: ["PO.3.1"]
    notes: >
      DECLARED IS NOT INSTALLED. An audit on 2026-08-07 found `.claude/settings.json` declaring and
      enabling paridyum-platform while the marketplace had never been added to Claude Code. The
      consequence was total and silent: ADR-0007 layer 1 had never fired once — no PreToolUse
      denial, no SessionStart injection — and the ADR-0025 Stop hook had never run automatically, so
      every checkpoint commit that day was invoked by hand.
      repo.enables_paridyum_platform_plugin passed throughout, because it reads the config file. A
      config file is a statement of intent, and treating intent as enforcement is the defect class
      the ADR-0014 audit found four times. This check exists to keep those two apart.
      `warn`, and n/a where there is no ~/.claude. This is machine state rather than a repository
      property: CI will never have the plugin installed, and an error would fail every build for a
      condition CI cannot satisfy. A warning is the strongest honest severity, which is itself an
      argument for ADR-0004's plan upgrade — server-side enforcement would not depend on a local
      install at all.

  - check: repo.plugin_snapshot_matches_head
    spec: >
      Fails when installed_plugins.json pins a gitCommitSha for which `plugins/paridyum-platform/`
      differs from HEAD, or names a commit absent from the clone.
    owner: check-repo.sh
    blocks: [ADR-0027]
    declared: 2026-08-07
    frameworks:
      ssdf: ["PS.1.1"]
    notes: >
      The plugin is a PINNED SNAPSHOT, so a committed hook fix is not running until
      `/plugin update` — correct in git, stale on disk, invisible from either side. Every hook fix
      made on 2026-08-07 (the index.lock pre-flight, the bulk guard, removing the 90-second suite
      from the Stop hook) would have sat inactive with nothing saying so.
      COMPARES THE SUBTREE, not commit distance. The first version warned on any gap and was caught
      being noise on its first real one: the pin was a commit behind while `plugins/` was
      byte-identical, so the running hooks were provably the repository's. A check that fires on every
      commit not touching the harness gets disabled (ADR-0008).
      `warn`, for two honest reasons: a snapshot legitimately lags a working tree between commits,
      and the pin can name a commit this clone has never fetched — which is reported differently,
      because "behind" and "unknown" are different problems.

