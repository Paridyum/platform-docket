      csf: ["PR.DS", "DE.CM"]
    notes: >
      Implemented by templates/infra-ci/scripts/secret-scan.sh, called by the
      pre-commit hook, knowledge-check.yml and rust-ci.yml — one script, so the
      layers cannot drift. It took four attempts to make this check real: the
      config could not compile (RE2 has no lookahead); the URI scheme was a capture
      group so gitleaks reported "postgres" as the secret and the placeholder
      allowlist never applied; gitleaks-action needs an org licence and dies on
      2026-09-16 with Node 20; and rust-ci.yml had no secret-scan job at all. Every
      one of those failed in a direction that reported success. Treat a green secret
      scan as suspicious until you have watched it fail on a planted secret.

  # --- rfc.* ----------------------------------------------------------------
  - check: repo.session_checkpoint_hook_registered
    spec: >
      Fails when hooks.json does not register checkpoint-session.sh as a Stop hook, when it is
      registered before capture-open-loops.sh, or when the script is not executable.
    owner: check-repo.sh
    blocks: [ADR-0025, ADR-0043]
    declared: 2026-08-07
    notes: >
      An automation that silently stops being registered protects nothing, and — this is the
      part that makes the check necessary — **its absence is indistinguishable from its
      success**. Either way there are no error messages and no interruptions, right up until
      the disk is gone. Nothing else in the system would notice.
      Checks ORDER, not just presence. capture-open-loops.sh rewrites DECISION-DEBT.md, so a
      checkpoint running before it leaves the regenerated ledger uncommitted until the next
      session — the exact gap ADR-0025 closes, reintroduced one file at a time.
      Checks the executable bit separately, because the first attempt at this decision produced
      a hook that was registered and not executable: configured, silent, and doing nothing. The
      check caught it immediately, which is the argument for writing the check before trusting
      the hook.

  - check: rfc.has_alternatives_section
    spec: >
      Fails when an artifact of type rfc has no section heading drawn from the
      accepted set — Options, Alternatives, Rejected alternatives, Alternatives
      considered.
    owner: check-knowledge.sh
    blocks: [ADR-0013]
    declared: 2026-08-06
    notes: >
      The accepted set is not optional detail. RFC-0001 heads its section `## Options`
      with sub-headings A/B/C, so a check matching only /alternative|rejected/ fails
      the only RFC in the repository — and would push authors to rename a section to
      satisfy a regex rather than to think. Match the set, not one word.

  # --- rust.* — ADR-0005 error and panic discipline -------------------------
  - check: rust.anyhow_only_in_binaries
    spec: >
      Fails when `anyhow` is used in a library target, where ADR-0005 requires
      typed errors via thiserror.
    owner: tool-forge
    blocks: [ADR-0005]
    declared: 2026-08-06

  - check: rust.no_panic_in_libraries
    spec: >
      Fails when a crate in a repository matching `applies_to` — `lib-*` —
      contains a reachable `panic!`, `unreachable!`, `todo!` or `unimplemented!`
      outside test code.
    owner: tool-forge
    blocks: [ADR-0005]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.5.1"]
    notes: >
      Reachability is undecidable in general; a syntactic scan is the honest
      implementation and will flag deliberate invariant assertions. Needs an
      explicit allow annotation, or it will be disabled rather than satisfied.

  - check: rust.no_unwrap_or_expect_outside_tests
    spec: >
      Fails when `unwrap()` or `expect()` appears outside a `#[cfg(test)]` module,
      a tests/ directory, or a doc test.
    owner: tool-forge
    blocks: [ADR-0005]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.5.1"]

  # --- rustdoc.* ------------------------------------------------------------
  - check: rustdoc.builds_without_warnings
    spec: >
      Fails when `cargo doc` emits any warning, including broken intra-doc links.
    owner: infra-ci
    blocks: [STD-0002]
    declared: 2026-08-06

  - check: rustdoc.missing_docs_denied
    spec: >
      Fails when a crate does not deny `missing_docs`, or denies it and still
      produces a missing-docs diagnostic.
    owner: tool-forge
    blocks: [STD-0002]
    declared: 2026-08-06
    notes: >
      Overlaps crate.public_api_is_documented — see that entry. This one is the
      cheaper implementation because rustc computes it.

  # --- rustfmt.* ------------------------------------------------------------
  - check: rustfmt.check_passes
    spec: >
      Fails when `cargo fmt --check` reports any formatting difference.
    owner: infra-ci
    blocks: [STD-0003, STD-0012]
    declared: 2026-08-06

  # --- telemetry.* — ADR-0044 audit and correlation --------------------------
  - check: telemetry.correlation_id_is_propagated
    spec: >
      Fails when a service generates a new correlation id for an inbound request that already
      carries one, or when an outbound call omits the id it received.
    owner: tool-forge
    blocks: [ADR-0044]
    declared: 2026-08-08
    notes: >
      Regeneration rather than propagation fails in exactly one way and it is invisible from any
      single service: every service works, every log line carries an id, and no trace spans two
      of them. It is discovered during an incident, when the question is what happened across
      the whole request.
      Unlike most of this registry, the defect cannot be repaired after the fact. A request that
      has already been served cannot acquire an id, so the gap is permanent for exactly the
      period nobody can produce evidence for — which is why ADR-0044 makes it an error.
      Needs to read call sites across a service, so it is tool-forge's rather than a bash gate's.

  # --- terraform.* ----------------------------------------------------------
  - check: terraform.fmt_and_validate
    spec: >
      Fails when `terraform fmt -check` reports a difference or `terraform
      validate` reports an error.
    owner: tool-forge
    blocks: [ADR-0003, ADR-0020]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.9.1"]
      cis: ["4.1"]

  # --- test.* — STD-0001, STD-0008, STD-0009 --------------------------------
  # The namespace holds every axis of test-registry.yaml rather than splitting into
  # perf.* and sec.*. One check per subject was the alternative and it would have put
  # `perf.load_test_asserts_the_declared_budget` in a namespace with one member, cited by
  # nothing, blocking a deferred requirement — a declaration with no home. Whether a
  # namespace earns its own prefix is decided by how many checks it holds, not by how
  # distinct the subject sounds.
  - check: test.account_assertion_is_exercised
    spec: >
      Fails when a repository defines the ADR-0038 account assertion but no test plants a row
      carrying a foreign account_id and asserts that the assertion raises.
    owner: tool-forge
    blocks: [ADR-0038]
    declared: 2026-08-08
    notes: >
      ADR-0038 decision 5 is deliberately redundant with RLS, and redundant code is the kind
      that rots unnoticed: if RLS is working, the assertion never fires, and an assertion that
      never fires is indistinguishable from one that was deleted or inverted.
      So the test is the only thing that keeps the second control real, and it has to plant the
      defect — the same rule scripts/test-checks.sh applies to every gate here. STD-0009's
      framing holds: the denial is the assertion.

  - check: test.authorization_matrix_has_no_untested_cell
    spec: >
      Fails when a declared role-by-resource authorisation matrix contains a cell that no
      test exercises, in either the granted or the denied direction.
    owner: tool-forge
    blocks: [STD-0009]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2"]
      cis: ["6.8", "16.12"]
      csf: ["PR.AA"]
    notes: >
      Requires the matrix to be declared somewhere machine-readable, which is a
      precondition this check cannot create. Until it is, the honest report is "no matrix
      declared" rather than a pass — a check that silently passes on a missing input is the
      defect class the ADR-0014 audit found four times.

  - check: test.bugfix_carries_a_regression_test
    spec: >
      Fails when a commit whose Conventional Commit type is `fix` changes source files and
      changes no test file, without an exception recorded in the commit body.
    owner: infra-ci
    blocks: [STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["RV.3.3", "RV.3.4"]
      cis: ["16.3"]
    notes: >
      Reads the commit range the way check-commits.sh does, so it inherits that script's
      hard-won range handling — ADR-0016 records that the identity gate examined an empty
      range on every push and reported success. The exception path is deliberate and
      narrow: a reproduction that genuinely cannot be automated must say so, because a rule
      with no legal exception is one people learn to phrase around.

  - check: test.coverage_meets_threshold
    spec: >
      Fails when total line coverage is below the `line` threshold or patch
      coverage is below the `patch` threshold.
    owner: infra-ci
    blocks: [STD-0001]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.8.2"]
      cis: ["16.12"]
    notes: >
      STD-0001 sets line 70, patch 80. Patch coverage needs a base ref to diff
      against, so it degrades to total-only on a push to the default branch.

  - check: test.default_profile_does_not_retry
    spec: >
      Fails when a test runner's default (non-CI) profile configures a retry count greater
      than zero.
    owner: check-repo.sh
    blocks: [STD-0001, STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2"]
    notes: >
      STD-0001 already sets `retries = 0` in the default profile and a bounded backoff in
      CI, and explains the split: CI retries absorb infrastructure noise, not flakiness. The
      check exists because the default profile is the one a person runs, and hiding a flake
      there removes the only cheap opportunity to see it.

  - check: test.doc_tests_enabled
    spec: >
      Fails when doc tests are disabled for a crate, whether by `doctest = false`
      or by a runner configuration that skips them.
    owner: tool-forge
    blocks: [STD-0001]
    declared: 2026-08-06
    notes: >
      nextest does not run doc tests at all, so a repository using it satisfies
      test.nextest_configured while silently skipping every doc test. This check
      is what closes that specific hole — the two are coupled.

  - check: test.evidence_is_published_for_blocking_tiers
    spec: >
      Fails when a CI job implementing a tier that STD-0008 marks blocking finishes without
      uploading the machine-readable artifact its test types declare in test-registry.yaml's
      `evidence` field.
    owner: tool-forge
    blocks: [STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PO.3.3", "PO.4.2"]
      csf: ["GV.OV"]
    notes: >
      The one check that makes `evidence` a field rather than a label. It cannot verify the
      artifact's CONTENT, only that one was produced — so a job uploading an empty junit.xml
      passes. Stated here because a check verifying less than its name implies is this
      repository's most-repeated defect, and this one is a partial by construction.

  - check: test.flaky_tests_are_quarantined_with_an_owner
    spec: >
      Fails when a test is recorded as flaky and the quarantine entry lacks an owner, a
      first-seen date, an observed failure rate, a tracking reference or an expiry — or when
      a quarantined test is still present in a blocking tier.
    owner: check-repo.sh
    partial: true
    blocks: [STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PO.4.1"]
      csf: ["GV.OV"]
    notes: >
      The second clause is the one that matters. An entry with full paperwork that still
      runs in the blocking tier has documented the flake rather than removed it, and the
      "just rerun CI" habit it teaches is what costs more than the failures the suite would
      have caught. Expiry reuses ADR-0017's mechanic rather than inventing a third one.
      Implements FLAKY-002 — five columns filled, because each answers a question that decides
      whether the entry can ever close. The second clause of the spec, that a quarantined test is
      absent from the blocking tier, needs a test runner and stays unimplemented; declared
      `partial` rather than counted whole.

  - check: test.integration_tests_use_testcontainers
    spec: >
      Fails when a repository matching `applies_to` — `svc-*` or `platform-*` —
      has integration tests that reach a database or external service without
      provisioning it through testcontainers.
    owner: tool-forge
    blocks: [STD-0001]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.8.2"]

  - check: test.migration_is_applied_and_reverted_in_ci
    spec: >
      Fails when a pull request adding a migration does not apply it and revert it against a
      real database in CI, or reverts it without asserting the schema returned to its prior
      state.
    owner: tool-forge
    blocks: [STD-0006, STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2"]
      csf: ["PR.DS"]
    notes: >
      REQ-0008 §4 — "an untested down-migration is a comment". Does NOT cover the harder half
      of §3: the new schema running against the PREVIOUS application version, which is the
      case that breaks a rolling deploy and needs two builds in one job. That remains
      declared and unbuilt rather than folded in here, so the name does not overclaim.

  - check: test.mutation_score_meets_threshold
    spec: >
      Fails when the mutation score over the files changed by a pull request is below the
      `threshold` argument.
    owner: tool-forge
    blocks: [STD-0001, STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PO.4.1", "PW.8.2"]
      cis: ["16.12"]
    notes: >
      Scoped to changed files, not the workspace: a full mutation run is hours and would be
      turned off within a month. Cited at `warn` in STD-0008 because the score is noisy on
      small diffs, and a hard gate on a noisy metric is a gate that gets disabled — which is
      strictly worse than a warning that is read.

  - check: test.nextest_configured
    spec: >
      Fails when the file named in `path` — .config/nextest.toml — is absent from
      a repository containing Rust tests.
    owner: tool-forge
    blocks: [STD-0001]
    declared: 2026-08-06

  - check: test.no_ignored_tests_without_reason
    spec: >
      Fails when an `#[ignore]` attribute carries no reason string.
    owner: tool-forge
    blocks: [STD-0001]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PW.8.2"]
      csf: ["GV.OV"]
    notes: >
      STD-0001's rationale for this check is itself corrupted — an unquoted `#`
      truncated it to "An" at YAML parse time. The intended text was "An
      #[ignore] with no reason is a permanently disabled test nobody will
      revisit." Recorded here because STD-0001 is locked and cannot be corrected
      in place.

  - check: test.no_io_in_unit_tier
    spec: >
      Fails when a test classified in the unit tier opens a network socket, reads outside
      the crate's fixture directory, or sleeps.
    owner: tool-forge
    blocks: [STD-0001, STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2"]
    notes: >
      STD-0001 states the rule; this is what makes it observable. The `sleep` clause is the
      valuable one — STD-0001 calls a sleep in a test a race condition with a timeout — and
      it is also the hardest to detect without running the test, so a first implementation
      that only catches sockets should be declared `partial` rather than counted whole.

  - check: test.operator_scope_denial_is_asserted
    spec: >
      Fails when a repository whose session type can carry operator scope has no test
      asserting that a session WITHOUT an explicit operator claim reads zero rows outside
      its own account.
    owner: tool-forge
    blocks: [ADR-0024, STD-0009]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2", "PW.9.1"]
      cis: ["6.8", "16.12"]
      csf: ["PR.AA"]
    notes: >
      The negative direction is the entire check. GLO-0005's failure mode is permissive —
      breadth granted by a dropped field, a null lookup, a middleware ordering mistake — so
      a suite asserting only that an operator CAN see every account passes identically
      against the implementation the rule forbids.

  - check: test.static_analysis_runs_on_pull_request
    spec: >
      Fails when a repository's pull-request pipeline runs no static application security
      analysis, or runs one whose findings are not published as a machine-readable report.
    owner: infra-ci
    partial: true
    blocks: [STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.7.1", "PW.7.2", "RV.1.2"]
      cis: ["16.12"]
      csf: ["PR.PS-06"]
    notes: >
      Partly satisfied today: `clippy --all-targets --all-features -D warnings` runs in the
      shared workflow, and ADR-0005's error and panic rules make several of its lint
      categories security controls rather than style ones. The unmet half is the report —
      clippy's findings live in a log that expires, which fails the second clause.
      PARTIAL, and the split is the honest half of this entry: rust-ci.yml emits clippy's
      findings as a JSON artifact, which satisfies the report clause, and nothing yet verifies
      that a pipeline runs static analysis AT ALL. Counting it whole would overstate enforcement
      in exactly the way the `partial` flag exists to prevent.

  - check: test.tenant_isolation_suite_covers_owned_tables
    spec: >
      Fails when a repository declaring `owns.tables` in its manifest.yaml has a
      tenant-scoped or account-scoped table with no test asserting cross-tenant denial and
      cross-account denial for it.
    owner: tool-forge
    blocks: [ADR-0024, STD-0009]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PW.8.2"]
      cis: ["16.12"]
      csf: ["PR.AA", "PR.DS"]
    notes: >
      Both boundaries, because nested tenancy has two (GLO-0004). A suite covering only the
      outer one passes against a schema with no `account_id` predicate at all, which is
      ADR-0024 decision 3's failure exactly: it isolates businesses from each other and
      nobody's customers, and every dashboard reports it healthy.

  - check: test.testing_md_declares_untested_surface
    spec: >
      Fails when a repository containing tests has no TESTING.md, or has one without a
      section stating what is deliberately not tested.
    owner: check-repo.sh
    blocks: [STD-0001, STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PO.4.1"]
      csf: ["GV.OV"]
    notes: >
      STD-0001 requires the untested surface to be stated "in the repository's TESTING.md"
      and nothing required that file to exist, so the requirement was satisfiable by
      omission. Same shape as docs.required_files_present, which is why the fix is a
      required file rather than a prose reminder.
      MOVED off tool-forge on 2026-08-08, the day it was declared. It reads a file in a
      checkout, which is the whole of the header's rule about what does and does not need a
      binary nobody has written. An inline copy briefly existed in rust-ci.yml and was removed:
      one rule, one implementation, or the two drift with nothing comparing them.

  - check: test.tiers_are_declared_in_ci
    spec: >
      Fails when a repository's CI configuration runs a test suite that is not assigned to a
      tier declared in test-registry.yaml, or assigns a test type to a tier other than the
      one the registry declares for it.
    owner: check-repo.sh
    partial: true
    blocks: [STD-0008]
    declared: 2026-08-08
    frameworks:
      ssdf: ["PO.3.1", "PO.4.1"]
      csf: ["GV.PO"]
    notes: >
      The check that keeps the pipeline and the registry one vocabulary rather than two. The
      second clause is the one with teeth: a repository moving its integration suite to
      nightly because it got slow has changed a governance decision by editing a YAML file,
      and this is what makes that visible.
      Implemented against TESTING.md's Tiers section rather than by parsing CI YAML, and that
      narrows the spec twice — honestly, and `partial: true` is what says so.
      It verifies that every TST- id named there resolves in test-registry.yaml. It does NOT
      verify the pipeline matches the declaration: guessing which workflow step is which test
      type is the inference that produces a check verifying less than its name implies.
      It also does not validate TIER names. The first version did, by reading every backticked
      lowercase word in the section — which made `push`, a GitHub event named in this
      repository's own TESTING.md, an undeclared tier, and failed four unrelated fixtures with
      it. A `TST-` id can only be one thing; a backticked word is anything at all, and
      distinguishing them needs a table format STD-0008 never required.

  # --- web.* — ADR-0046, the RSC trust boundary ------------------------------
  - check: web.data_layer_modules_are_server_only
    spec: >
      Fails when a module that imports a database client, a Zitadel client or a credential does
      not declare `server-only`, so nothing prevents a client component importing it.
    owner: tool-forge
    blocks: [ADR-0046]
    declared: 2026-08-08
    notes: >
      The tractable half of ADR-0046 decision 4, and the one that catches the actual leak vector.
      A React Server Component runs with server credentials; a `"use client"` component does not,
      and everything it closes over is serialised to the browser. The `server-only` package turns
      that from a runtime leak into a build error, and this check is the thing that notices when
      a new data module forgets to declare it.
      Decidable from imports, which is why it is separable from the general rule. The general
      rule — a value crossing the boundary that should not — needs type-level flow analysis and
      is not attempted here.

  - check: web.server_actions_authorize
    spec: >
      Fails when a function exported from a `"use server"` module reaches a data layer without
      an authorization call on every path.
    owner: tool-forge
    blocks: [ADR-0046]
    declared: 2026-08-08
    notes: >
      A Server Action looks like a function call and is a publicly callable HTTP endpoint,
      unauthenticated by default. RFC-0008 cites a CVSS 10.0 advisory on exactly this surface,
      and the reason it keeps happening is that the defect is invisible at the call site: the
      caller is a component the author trusts, so the endpoint's public reachability never
      enters their head.
      Heuristic by necessity — "an authorization call" is a project convention, not a language
      construct — so it needs a named helper to look for, which `template-web` must establish
      before this can be implemented.

  # --- workstation.* --------------------------------------------------------

  - check: workstation.doctor_passes
    spec: >
      Fails when `bootstrap.sh --check` or `forge doctor` reports a missing or
      misconfigured workstation prerequisite.
    owner: tool-forge
    blocks: [ADR-0006, RUN-0001]
    declared: 2026-08-06
    frameworks:
      ssdf: ["PO.3.2", "PO.5.1"]
    notes: >
      Enforced on a machine, not in repository CI — the only check in the
      id-space with no repository to run against. `forge audit` cannot evaluate
      it at all.
