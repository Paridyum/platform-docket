  # --- repo.* — repository shape, the largest namespace ---------------------
  - check: repo.checkpoint_branch_is_not_default
    spec: >
      Fails when the session-checkpoint hook commits to the repository's default branch, or
      when it can silently fall back to the default branch if branch creation fails.
    owner: check-repo.sh
    blocks: [ADR-0043]
    declared: 2026-08-08
    notes: >
      The entire change from ADR-0025 to ADR-0043 is that checkpoints stop landing on the branch
      everything is reviewed from. A fallback to `main` would restore the old behaviour while the
      ADR claims otherwise, and nothing else would notice — the commits would look exactly as
      they did before, which is how the original defect survived for eleven commits.
      Checked by reading the hook rather than the history: a repository with no checkpoint
      commits yet would otherwise pass vacuously.

  - check: repo.ci_runs_knowledge_check
    spec: >
      Fails when a repository has no CI workflow invoking the knowledge gate on
      pull requests and on pushes to the default branch.
    owner: check-repo.sh
