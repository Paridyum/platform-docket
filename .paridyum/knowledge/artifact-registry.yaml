# Paridyum artifact-type registry — the single source of truth, declared under ADR-0022.
#
# FOURTH INSTANCE of a pattern this repository has now used three times. ADR-0014 moved
# check ids out of code into check-registry.yaml. ADR-0015 moved scope resolution from an
# enumeration to a rule. C-0005 moved repository classes out of a locked prose table into
# class-registry.yaml. Each time, the defect was the same: a list that must be extended,
# hardcoded in a place extending it is expensive.
#
# The artifact-type list was the worst remaining instance. Adding one type meant editing
# FIFTEEN sites, fourteen of which fail silently when missed. A `bets/` directory absent
# from ART_DIRS is not scanned at all: no error, no warning, a whole artifact class
# unenforced while the gate reports green. That is precisely the defect class the ADR-0014
# audit found four times over, and it is why this file exists before the type it was
# written to add.
#
# Three of the fifteen were found already carrying a STALE list, having drifted with nobody
# noticing — including a real hole in ADR-0007's layer 1, the enforcement layer CLAUDE.md
# describes as impossible to reason around: guard-locked-decisions.sh omitted
# `requirements/`, so a locked REQ- could be rewritten in place, in-session, while
# check-knowledge.sh section 3 forbade exactly that. Twelve was the count before those three
# were found. The undercount is itself the argument.
#
# GENERATES, rather than duplicates:
#   knowledge.schema.json   `type` enum, and the prefix alternation in its four id patterns
#   check-knowledge.sh      the scanned-directory list, the id pattern, the cross-reference
#                           scanner's prefix set, the immutability directory filter, and
#                           the per-type status vocabulary
#
# CHECKED but not generated — hardcoded for a stated reason, with section 8c comparing them:
#   guard-locked-decisions.sh   PreToolUse; runs on every tool call, so it must stay fast
#                               and dependency-free. A YAML parse per keystroke is a hook
#                               people disable.
#   capture-open-loops.sh       same, on the Stop hook.
#   check-registry.schema.json  not generated by this gate; its `blocks` pattern is compared.
#
# NEITHER generated nor checked, deliberately: the layout prose in README.md and CLAUDE.md.
# A generated table dropped into the middle of an argument reads worse than a stale one.
# Those two are the only remaining places this list can rot unobserved.
#
# FOUR INDEPENDENT AXES, and conflating them is what made the old rules special-cased.
# `lockable` says whether a type may ever be `locked`. `deferrable` says whether it may use
# the requirement-only `deferred` status. `requires_trigger` says when a falsification
# condition is mandatory. ADR-0018's "deferred requires a trigger" and ADR-0022's "a bet
# always requires one" are the same rule at two settings, not two rules.
# `requires_sources` says when a `sources` block is mandatory, and it is the fourth axis rather
# than a fourth special case for the same reason: ADR-0050 needed "a market artifact must cite
# its evidence", and the alternative was `type == market` hardcoded in the gate — which is
# exactly the shape `requires_trigger` replaced when it absorbed `type == requirement`.
#
# THE COUNT IN THIS HEADING SAID "THREE" FOR THE WHOLE OF THE DAY THE FOURTH WAS ADDED. Nothing
# checks it, because this block is one of the two the file's own header calls out as neither
# generated nor compared. That is the cost accepted there, and it came due within hours — worth
# recording rather than quietly correcting, since the next axis will do the same thing.
#
# BEHAVIOUR IS REPRODUCED, NOT CORRECTED. `immutable_when_locked` is false for `rfc` and
# `runbook` because check-knowledge.sh's section-3 filter has always omitted those two
# directories. That asymmetry may well be wrong — a locked runbook is as much a record as a
# locked standard — but changing behaviour while moving it is how detail gets lost (the
# lesson class-registry.yaml records about ADR-0010's `ci: false` for infra). Correcting it
# is a one-line change here and a separate decision.
#
# EXERCISED ONCE, ON 2026-08-07. `glossary` was added by editing this file and
# knowledge.schema.json and nothing else. Section 8c then failed on all three of the
# hardcoded-but-checked sites, which still carried the nine-prefix set — the exact silent
# failure this registry exists to convert into a loud one, caught on its first unassisted run.
# That was the condition ADR-0022 named before allowing itself to be locked.
#
# Schema: artifact-registry.schema.json. Validated by knowledge.artifact_registry_valid.
# Sorted by type.

version: 1

types:
  - type: adr
    prefix: ADR
    directory: adr
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: One architectural decision, its context, and the cost accepted with it.
    declared: 2026-08-07
    notes: >
      The workhorse type. C-0001 principle 8 is the shape: an ADR listing only benefits is
      incomplete and probably wrong, because the value of the record is the rejected
      alternatives and the accepted costs.

  - type: anti-pattern
    prefix: ANTI
    directory: anti-patterns
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: A forbidden shape, recorded with the reason it is forbidden.
    declared: 2026-08-07
    notes: >
      Most are `accepted` rather than `locked`, and ANTI-0004 explains why: whether a
      function is a domain rule or a utility is a judgement no check can make. An
      anti-pattern locked against a proxy check would claim more than it enforces.

  - type: bet
    prefix: BET
    directory: bets
    lockable: false
    deferrable: false
    requires_trigger: always
    requires_sources: never
    immutable_when_locked: true
    description: A falsifiable commercial wager, with the evidence that would kill it.
    declared: 2026-08-07
    notes: >
      `lockable: false` is the load-bearing value and it is the reason this is a separate
      type rather than an ADR with a market-facing tag. CLAUDE.md defines `locked` as "must
      not be contradicted — not by you, not by a human, not temporarily". A bet exists
      precisely to be contradicted, by evidence, on a date already written down. Locking one
      would make the word mean two incompatible things, which is the same argument C-0001
      uses to stay `accepted`.
      `requires_trigger: always`, because a wager with no stated losing condition is not a
      bet, it is an opinion with frontmatter — ADR-0018's argument about deferred
      requirements, transplanted. `review_date` is mandatory for the same reason it is
      useful on a deferred requirement: a wrong trigger must not bury the question forever.
      `immutable_when_locked: true` is vacuous today and deliberately still true. A bet
      cannot be locked, so the flag can never fire — but it WILL fire on `superseded`, which
      is how a bet ends, and section 3 freezes superseded artifacts as hard as locked ones.
      A killed bet is the most valuable kind and the easiest to quietly rewrite.

  - type: constitution
    prefix: C
    directory: constitution
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: Foundational, org-wide rules. Highest precedence, rarely changed.
    declared: 2026-08-07
    notes: >
      The only non-plural directory besides `adr` and `rfc`, which is why the mapping is
      data here rather than a pluralisation rule applied to the type name. A rule inferring
      `constitutions/` would have been correct for five of nine types and silently wrong for
      the rest.

  - type: glossary
    prefix: GLO
    directory: glossary
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: One term, one meaning, org-wide, with the shapes it is confused with.
    declared: 2026-08-07
    notes: >
      The SECOND type added through this registry rather than by hand-editing fifteen sites,
      which is the point of the mechanism and the condition ADR-0022 named before locking.
      `glossary/` existed as a directory, was listed in README.md's layout, and was absent
      from every artifact type — so its contents were unvalidated prose in a repository whose
      founding argument is that unenforced prose is a suggestion. It was also empty, which is
      why nobody noticed. ADR-0024 records what made that expensive: a term used thirty-six
      times across binding artifacts with no definition anywhere.
      `lockable: true` because a definition is exactly the kind of rule a check can enforce —
      not the prose, but that a term with a defined meaning is not silently redefined
      elsewhere, and that the identifier a definition names is the identifier the schema uses.

  - type: market
    prefix: MKT
    directory: markets
    lockable: false
    deferrable: false
    requires_trigger: never
    requires_sources: always
    immutable_when_locked: true
    description: Dated market or customer evidence, with the external sources it rests on.
    declared: 2026-08-17
    notes: >
      The THIRD type added through this registry rather than by hand-editing fifteen sites.
      It exists because C-0006 carries an obligation no type could satisfy: every vertical
      Paridyum enters "must be recorded in an artifact naming the evidence that selected it,
      and that evidence may not be tenant-derived." There was nowhere to put that. A BET- is
      the closest existing shape and it is the wrong one — a bet is a wager and its
      interesting field is what would kill it, while this is an observation and its
      interesting field is where it came from and when.
      `lockable: false` for the reason `bet` and `rfc` carry it, arrived at from a third
      direction: `locked` means must-not-be-contradicted, and evidence exists to be
      contradicted by better evidence. A locked market finding would be a snapshot with the
      authority of a decision, which is the failure RFC-0005 rejected the constitution as a
      container for.
      `requires_trigger: never` is the line between this type and `bet`, and it is worth
      stating because the two will be confused. An observation has no falsification
      condition; the wager it supports does. "Indian SMB payment onboarding takes eleven
      days" is an MKT-. "Founders will pay a floor plus a royalty" is a BET-. When an author
      cannot tell which they are writing, the test is whether the sentence could be checked
      against the world today (MKT-) or only judged later (BET-).
      `immutable_when_locked: true` is unreachable through `locked` and deliberately still
      true, exactly as `bet` records: it fires on `superseded`, which is how a market finding
      ends. Evidence that turned out wrong is the most valuable kind and the easiest to
      quietly rewrite once the vertical it selected is already being built.
      THE LOAD-BEARING RULE IS `requires_sources: always`, ABOVE. RFC-0020 already
      established that external facts are cited and dated; this is the type where that stops
      being good practice and becomes the definition. A market artifact without a source is an
      opinion with frontmatter — the same sentence ADR-0018 wrote about a deferred requirement
      without a trigger, which is the third time this repository has needed it.
      CORRECTED 2026-08-17, and the correction is the point. This note previously read
      "knowledge.schema.json requires `sources` on this type and on no other." It did not, and
      it could not: scripts/lib/validate-schema.py implements no conditional keywords, so an
      `if`/`then` in the schema would have been reported as unsupported and enforced nothing.
      The claim was written, believed, and never watched failing — a sourceless MKT- was
      planted on 2026-08-17 and validated clean. This is the ADR-0014 defect class appearing
      on the one type whose entire purpose is citation, which is why it is recorded here at
      length rather than quietly fixed. `requires_sources` is a registry field for the same
      reason `requires_trigger` is: the grammar is constitutional and the list is data.

  - type: pattern
    prefix: PAT
    directory: patterns
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: A preferred implementation, to be copied rather than reinvented.
    declared: 2026-08-07
    notes: >
      No artifact of this type exists yet. Declared because the directory, the prefix and
      the schema enum value all already existed — the registry records the id-space as it
      is, not only the parts that are populated.

  - type: requirement
    prefix: REQ
    directory: requirements
    lockable: true
    deferrable: true
    requires_trigger: when_deferred
    requires_sources: never
    immutable_when_locked: true
    description: What the platform must eventually do, including deliberately unscheduled work.
    declared: 2026-08-07
    notes: >
      The only `deferrable: true` entry, which is exactly what ADR-0018 decided and what
      check-knowledge.sh previously hardcoded as `type == requirement`. Moving it here is
      what lets `bet` reuse the trigger machinery without inheriting `deferred`: a bet is
      never "accepted as real but unscheduled", it is live or it is dead.

  - type: rfc
    prefix: RFC
    directory: rfc
    lockable: false
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: false
    description: An open question or design proposal, written before a decision exists.
    declared: 2026-08-07
    notes: >
      `lockable: false` reproduces existing practice rather than imposing a new rule: an RFC
      resolves to an ADR or a constitution and records that in `resolved_by`, so a locked RFC
      would be a decision filed under "open questions". No RFC has ever been locked.
      `immutable_when_locked: false` reproduces section 3's directory filter, which has
      always omitted `rfc/`. With `lockable: false` the flag is unreachable anyway, and it is
      stated rather than omitted so the twelve-site list stays fully represented here.

  - type: runbook
    prefix: RUN
    directory: runbooks
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: false
    description: An operational procedure, including workstation provisioning.
    declared: 2026-08-07
    notes: >
      `immutable_when_locked: false` is the asymmetry described in the header. Section 3 has
      never protected `runbooks/`, so neither does this entry. Preserved, flagged, not fixed
      here.

  - type: standard
    prefix: STD
    directory: standards
    lockable: true
    deferrable: false
    requires_trigger: never
    requires_sources: never
    immutable_when_locked: true
    description: How to write things — language, API, testing, logging, database.
    declared: 2026-08-07
