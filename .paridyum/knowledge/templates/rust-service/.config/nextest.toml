# STD-0001. Retries absorb infrastructure noise, not test flakiness: a test that only
# passes on retry is failing, and nextest's flaky reporting surfaces it.
[profile.default]
retries = 0
failure-output = "immediate"

[profile.ci]
retries = { backoff = "exponential", count = 2, delay = "1s" }
failure-output = "immediate-final"
fail-fast = false
status-level = "skip"

[profile.ci.junit]
path = "junit.xml"

[profile.integration]
test-threads = 4
slow-timeout = { period = "30s", terminate-after = 4 }
