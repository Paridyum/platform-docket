# Paridyum repository classes — the single source of truth, declared under C-0005.
#
# C-0002 held this list in a locked prose table, so adding a class meant superseding the
# naming constitution. The consequence of not fixing that is on record: ADR-0009 describes
# the previous estate as "predominantly Python with TypeScript frontends, none matching
# C-0002". The stack arrived without a class because the ceremony was too expensive.
#
# Third instance of a pattern this repository has used twice — ADR-0014 moved check ids
# out of code into a registry, ADR-0015 moved scope resolution from an enumeration to a
# rule. The rule stays in the artifact; the list lives here.
#
# GENERATES, rather than duplicates:
#   knowledge.schema.json   `scope` enum
#   manifest.schema.json    `class` enum
#   check-knowledge.sh      the prefix-to-scope map, previously hardcoded
#
# TWO INDEPENDENT AXES. A class says WHAT a repository is. A stack says WHICH language
# rules bind it. `stacks` is the permitted set; a repository picks one and declares it as
# `stack` in its manifest. `mobile` is React Native on typescript or Flutter on dart —
# same class, different stack. `library` is a crate on rust or a package on typescript.
# Standards bind a stack, so neither leaks into the other. That is what makes a second
# stack cheap: React Native reuses whatever TypeScript already has.
#
# THE CLASSLESS CASE IS NOT HERE. `knowledge` has no prefix and no class, deliberately
# (ADR-0015 point 6). It is governed by the `org`-scoped set. Inventing a class to satisfy
# a model is how models acquire vestigial concepts.
#
# `deployable` and `ci` replaced the `applies_to` prefix globs ADR-0003 and ADR-0010 used
# to carry. Those globs were the defect: a prefix glob in a locked artifact can never be
# extended to a new prefix.
#
# HONESTY ABOUT WHAT DOES NOT EXIST YET. A class here is a declaration that the class is
# legitimate and how it binds — NOT a claim that its standard, template or CI workflow
# exists. Most do not. Each entry says so. ADR-0021 records the underlying gap: nothing
# checks that a class marked `ci: true` actually has a workflow, and `infra-ci` itself does
# not exist yet.
#
# Schema: class-registry.schema.json. Sorted by class.

version: 1

classes:
  - class: agent
    prefix: agent-
    scope: agent
    stacks: [rust]
    deployable: false
    ci: true
    description: A distributed application that runs on machines the estate does not control and acts for one tenant.
    declared: 2026-09-27
    notes: >
      Added by ADR-0111 for RFC-0054's station — the first distributed client this estate
      ships. `deployable: false` is load-bearing rather than incidental: the agent is
      installed on a tenant's own machines, never scheduled onto the cluster, so ADR-0020's
      chart machinery does not reach it and this class must not be marked deployable.
      Its Zitadel application type is **Native**, and a station authenticates by **device
      authorization (RFC 8628)** — the one property `tool-` could not carry, because
      ADR-0070 D3 gives a tool no OIDC client and no internet identity. A repository in
      this class distributes a signed binary rather than a workload; REQ-0014's supply-chain
      rules apply to what it ships.

  - class: console
    prefix: console-
    scope: console
    stacks: [typescript]
    deployable: false
    ci: true
    description: An interface for Paridyum's own operators, run where the operator is.
    declared: 2026-08-21
    notes: >
      ADR-0055. The gap this fills is narrow and was load-bearing: `web` is
      "served from the cluster" with `deployable: true`, and locked ADR-0020 makes
      every deployable class owe Kubernetes probes, limits and a Helm chart. An
      interface running on an HR workstation owes none of those and has no cluster
      to owe them to. `tool` fits in every respect except "developer-facing", and
      stretching that word to mean "anyone internal" would leave it carrying no
      information.
      `deployable: false` IS THE POINT. A console is run, not deployed, so ADR-0020
      does not bind it — and ADR-0020's test keeps meaning what it says rather than
      acquiring an exception for the deployable-but-not-really.
      THE TEST IS REACHABILITY, NOT INTENT. If tenant traffic can reach it, it is
      not a console: C-0008 makes it a product and it belongs in `web-`. Chosen
      that way because reachability is the fact you can check, and "who we meant it
      for" is not.
      `stacks: [typescript]` adopts ADR-0046's decisions by reference — Next.js,
      pnpm, strict TypeScript, RFC-0003's supply chain rules. ADR-0046's
      `applies_to` is not widened to `console-*`; this class adopts its content
      rather than a decision written about something else being stretched to cover
      it. The RSC server/client trust boundary ADR-0046 flags as having "no Rust
      analogue" applies in full and is still undocumented as an ANTI- artifact.
      A CONSOLE HOLDS NO BUSINESS RULES. It calls a `tool-` or `platform-` for
      them. A rule in a console is ANTI-0004 with a different file extension: it
      then exists twice, and the copy in the interface is the one nobody tests.
      No template exists — RFC-0028 is `proposed` — so the first `console-`
      repository is scaffolded by hand and becomes the de facto template without
      having been reviewed as one.

  - class: game
    prefix: game-
    scope: game
    stacks: [rust, cpp]
    deployable: false
    ci: true
    description: One title's game client, distributed to players' own devices rather than run on the cluster.
    declared: 2026-10-07
    notes: >
      Added by ADR-0133 for RFC-0059's gaming line.
      A STACK IS A LANGUAGE, NEVER AN ENGINE. Bevy is `rust` and Unreal is `cpp`, as
      `mobile` has React Native on `typescript` and Flutter on `dart`. The engine is named
      in exactly one place, the title's own ADR, so no repository name, folder or scope
      carries it. Under ADR-0107 the stack suffix is optional, and appears only for a port —
      one title built in two engines.
      `deployable: false` because a title ships to stores and players' machines, never onto
      the cluster: ADR-0020 does not bind it, and the class starts, as `mobile` did, with no
      release governance. A dedicated server, code shared between titles, asset storage and
      an engine that needs native Windows are deferred with their triggers in ADR-0133
      decision 8.
      `cpp` has no toolchain pin, lint or standard; the first C++ title writes them. No
      repository exists, and per RFC-0059 D2 none receives production code until hosting has
      a paying customer who renewed.

  - class: infra
    prefix: infra-
    scope: infra
    stacks: [terraform, none]
    deployable: false
    ci: false
    description: Deployment and cluster configuration, versioned separately from services.
    declared: 2026-08-07
    notes: >
      `deployable: false` since 2026-08-08 (ADR-0037), corrected from `true`. An infra
      repository DEFINES the cluster; it does not run inside it, so ADR-0020's probes, resource
      limits and Helm chart were being required of the thing the cluster is described by.
      ADR-0020 line 109 already read that way — "sequence `infra-kubernetes` before any
      deployable repository goes live" treats it as the prerequisite FOR deployable repos. The
      interaction was blocking `infra-ci`, which locked ADR-0021 requires by name and which holds
      nothing but reusable workflow YAML. Nothing read the field, so the correction was free;
      after tool-forge implements `repo.has_helm_chart` it would have been a live failure on a
      production cluster repository. The cost is that `infra-*` now has NO release governance at
      all, exactly as `mobile` does — REQ-0004 owns it.
      `stacks: [terraform, none]` for the same reason: `infra-ci` is workflow YAML and shell,
      `infra-kubernetes` is charts and manifests, and neither is Terraform.
      `ci: false` reproduces ADR-0010's applies_to, which listed platform, svc, lib and
      tool but not infra. Infrastructure repositories therefore have no CI standard —
      including infra-kubernetes and infra-terraform, which will hold the cluster. A real
      gap, preserved rather than fixed during supersession because changing behaviour
      inside one is how detail gets lost. Correcting it is a one-line change here and a
      separate decision.

  - class: library
    prefix: lib-
    scope: library
    stacks: [rust, typescript]
    deployable: false
    ci: true
    description: A shared package consumed by other repositories, never deployed alone.
    declared: 2026-08-07
    notes: >
      Two stacks, which answers RFC-0004's open question about whether TypeScript needed a
      second prefix. It does not: `library` is the same concept either way, and C-0005's
      crate-naming and no-binary rules bind the `rust` stack rather than the `lib-` prefix,
      so a TypeScript package under lib- is simply not governed by them.
      THE OTHER HALF OF THAT QUESTION WENT UNANSWERED FOR SEVEN WEEKS AND IS ANSWERED BY
      ADR-0107. RFC-0004 asked whether `lib-` becomes stack-parameterised OR a second prefix
      appears; the paragraph above answers only the second half. It became load-bearing when
      one capability — verifying a Zitadel token — needed a repository in both stacks, and a
      repository declares exactly one `stack`, so two repositories wanted one name. The rule:
      where a class declares MORE THAN ONE STACK, the repository name carries the stack as a
      trailing segment (`lib-auth-rust`, `lib-auth-typescript`) and the published artifact
      drops it (`paridyum-auth`, `@paridyum/auth`), because cargo and npm namespaces are
      already per-stack. C-0007 carries the narrowing of its own "never a technology" rule.
      IT IS WRITTEN AGAINST `stacks`, NOT AGAINST `lib-`, so `mobile` below — typescript and
      dart — is governed by it without either entry being rewritten. That is the same reason
      `deployable` and `ci` replaced ADR-0003's and ADR-0010's prefix globs.

  - class: mobile
    prefix: mobile-
    scope: mobile
    stacks: [typescript, dart]
    deployable: false
    ci: true
    description: An application distributed through an app store rather than a cluster.
    declared: 2026-08-07
    notes: >
      `deployable: false` is the important value and it is not an oversight. A mobile app
      ships to Apple and Google, not to Kubernetes, so ADR-0020 must NOT bind it — probes,
      Helm charts and resource limits are meaningless here. The consequence is that mobile
      currently has NO release governance at all, because ADR-0020 was the only thing
      providing it. Store review, signing, phased rollout and OTA are REQ-0004 territory
      and deferred.
      Three constraints with no web or Rust analogue, recorded in RFC-0004: signing
      certificates are long-lived CI secrets (REQ-0001); store review sits between merge
      and users, breaking progressive delivery; and OTA is a second deployment path that
      bypasses store review entirely — CodePush was retired in March 2025, EAS Updates is
      the successor, and OTA can change the JS bundle but not native code, permissions or
      store metadata.
      No standard, template or workflow exists for either stack.

  - class: platform
    prefix: platform-
    scope: platform
    stacks: [rust]
    deployable: true
    ci: true
    description: Platform services every product depends on.
    declared: 2026-08-07

  - class: sdk
    prefix: sdk-
    scope: sdk
    stacks: [generated]
    deployable: false
    ci: true
    description: A client library generated from a specification and published to a registry.
    declared: 2026-08-07
    notes: >
      `stacks: [generated]` rather than a language list, because an SDK repository has no
      hand-written source in any language — it is output. C-0004 already governs it:
      generated code is regenerated, never edited, enforced by
      agent.generated_code_immutable. STD-0002 already models the discipline for API.md.
      So most code standards do not apply, and the checks that should are about provenance:
      is this current with the spec, and was it regenerated rather than hand-edited.
      What is missing is publishing. Evergreen SDKs are regenerated on every API change and
      pushed to npm, PyPI, crates.io and others — and those registry tokens are REQ-0001's
      problem, which is why REQ-0001 gates this class as much as it gates mobile.
      No generator, template or workflow chosen yet. `spec-` is the intended source.

  - class: service
    prefix: svc-
    scope: service
    stacks: [rust]
    deployable: true
    ci: true
    description: A business capability service. One repository is one bounded context.
    declared: 2026-08-07
    notes: >
      A background worker is deliberately NOT a separate class. A worker is a service with
      no `exposes.http` block — same deployment, same CI, same ownership rules. Adding a
      `worker-` prefix would classify by a property the manifest already records, which is
      over-classification rather than the god-class failure but wrong in the same way.

  - class: spec
    prefix: spec-
    scope: spec
    stacks: [none]
    deployable: false
    ci: false
    description: Interface contracts — OpenAPI documents and event schemas. No executable source.
    declared: 2026-08-07
    notes: >
      Intended to become the source of truth SDK repositories generate from, which would
      make `spec-` the upstream of `sdk-`. Not decided; RFC-0003 and RFC-0004 both leave it
      open.

  - class: template
    prefix: template-
    scope: template
    stacks: [none]
    deployable: false
    ci: false
    description: Scaffolding sources consumed by forge. May contain any stack as data.
    declared: 2026-08-07
    notes: >
      `stacks: [none]` because a template is not itself built — it holds source for
      whatever stack it scaffolds. `template-service` holds Rust; a future
      `template-web-app` would hold TypeScript; neither is compiled here.

  - class: tool
    prefix: tool-
    scope: tool
    stacks: [rust]
    deployable: false
    ci: true
    description: Developer-facing executables. Binary name is the bare capability.
    declared: 2026-08-07

  - class: web
    prefix: web-
    scope: web
    stacks: [typescript]
    deployable: true
    ci: true
    description: A user-facing web application, served from the cluster.
    declared: 2026-08-07
    notes: >
      The first class added through this registry rather than by superseding a
      constitution, which is the point of the mechanism.
      `deployable: true` because a Next.js application self-hosts via output "standalone"
      and runs as a normal workload — ADR-0020's probes, limits and chart apply unchanged.
      Its stack specifics are RFC-0003's subject: pnpm with install scripts disabled and a
      quarantine window, strict TypeScript, Vitest, Playwright, and the RSC server/client
      trust boundary, which has no Rust analogue and warrants its own ANTI- artifact.
      Adopting it fires REQ-0009's trigger, so accessibility belongs in the template rather
      than in prose afterwards.
      No standard, template or workflow exists yet.
