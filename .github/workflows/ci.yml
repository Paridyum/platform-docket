# Thin caller. All logic lives in the shared workflow (ADR-0010, ADR-0021) so a
# fix reaches every repository by moving a tag rather than by forty pull
# requests.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Paridyum/infra-ci/.github/workflows/rust-ci.yml@v1
    with:
      # msrv is deliberately not passed. ADR-0005 pins the toolchain exactly in
      # rust-toolchain.toml, so for a binary there is no consumer compiling this
      # with an older compiler and no minimum to support.
      #
      # integration: FALSE, corrected after the first real CI run.
      #
      # The shared workflow's integration step filters `test(/^it::/)` -- this
      # estate's naming convention for the testcontainers tier -- and nextest
      # exits non-zero when a filter matches nothing. The job failed while all
      # 219 tests had just passed in `test`.
      #
      # It was set true on the reasoning that the rendering tests ARE the slow
      # tier: forty seconds, real PDFs, the place the guarantees about output
      # bytes are made. That confused "slow" with "needs a container". The
      # `test` job already runs everything in tests/*.rs, so nothing is skipped
      # by turning this off.
      integration: false
      coverage-total: 70
      coverage-patch: 80
