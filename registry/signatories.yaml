# Who may sign on behalf of Paridyum. ONE home.
#
# WHY THIS FILE EXISTS. The source .docx documents gave three different
# answers: the Internship Agreement hardcoded a CEO/CTO pair, the NDA and
# IPA used [CEO Full Legal Name] placeholders, and the business
# communication letter named a third person as "Founder / Promoter". A
# document set that cannot state who its officers are is not signable.
#
# Corrected 2026-08-19: that third name was not connected to Paridyum and
# has been removed. Priyanshu Sharma is Director.
version: 1

# ORDER IS THE FALLBACK ORDER (ADR-0077 decision 4). `issue` walks a company's
# entries and takes the first who is not the subject of the document. That is
# what makes Priyanshu holding CEO and Director at once a data question rather
# than a special case in code: his own documents fall through to the CTO.
#
# `company` is the code in registry/org.yaml. Absent means PAR, so an entry
# written before the second company existed still means what it meant.
#
# ════════════════════════════════════════════════════════════════════════════
# WHO MAY CHANGE THIS FILE is not the same question as who may sign (ADR-0087).
#
# Editing an entry here appoints or removes an officer, which is authorised by
# ROHAN BATRA, and where he cannot act by PRIYANSHU SHARMA. That authority is
# personal and does not move when an office does -- Rohan is `cto` below and
# third in Paridyum's fallback order, and both of those are correct.
#
# Conflating the two would have meant reordering this list so Rohan signs
# everything, which is not what was decided and would change every document
# Paridyum issues. A document is executed by whoever holds the office it routes
# to, because that is what makes it verifiable years later.
#
# CEASING IS `active: false` PLUS `ceased_on`, NEVER DELETION (RFC-0042 §5).
# `docket check` refuses one without the other: a register that cannot say WHEN
# an officer ceased cannot say whether they held office on the date a given
# document was issued. A removal owes what an appointment owes -- a dated
# instrument, an entry citing it, and a human approving it under C-0004.
# ════════════════════════════════════════════════════════════════════════════

signatories:
  # ── PARIDYUM ────────────────────────────────────────────────────────────────
  #
  # PRIYANSHU HOLDS TWO ENTRIES, `ceo` AND `director`, because he holds both
  # offices. Two entries rather than one merged office, for two reasons:
  # lifecycle.yaml routes documents to `ceo` and `director` separately and an
  # office is not renamed because one person happens to hold both; and the
  # substitution in `issue` resolves correctly as a result -- for HIS OWN
  # documents both entries are the subject, so it falls through to `cto`, which
  # is the operator's decision of 2026-09-09 arrived at by data rather than by a
  # branch in code.
  - id: ceo
    company: PAR
    legal_name: PRIYANSHU SHARMA
    designation: Chief Executive Officer (CEO)
    short: CEO
    active: true
    appointed_on: null
    instrument: null
    note: >
      APPOINTMENT RECORDED, INSTRUMENT OUTSTANDING. RFC-0042 decision 5 wants a
      dated instrument (a directors' resolution, or founders' written consent
      while there is no CIN) cited here. The appointment date is 2026-10-01 for
      every officer; the instrument has not been produced, so BOTH fields stay
      null rather than half-filled, which would read as properly recorded.

  - id: director
    company: PAR
    legal_name: PRIYANSHU SHARMA
    designation: Director
    short: Director
    active: true
    appointed_on: null
    instrument: null
    note: >
      The same person as `ceo` above. Signs the business communication letter and
      is named in the Internship Agreement's future-incorporation clause as the
      one currently operating Paridyum. Director designate until the CIN is
      issued and org.yaml records it.

  - id: cto
    company: PAR
    legal_name: ROHAN BATRA
    designation: Chief Technology Officer (CTO)
    short: CTO
    active: true
    appointed_on: null
    instrument: null
    note: >
      Also CTO of PARIDYUM CYBER. One person, one person identifier, two
      engagements (ADR-0077 decision 2) -- not two identities. Last in this list
      on purpose: he is the fallback who executes the CEO-and-Director's own
      documents.

  - id: coo
    company: PAR
    legal_name: ADITYA SHRIVASTAVA
    designation: Chief Operations Officer (COO)
    short: COO
    active: true
    appointed_on: null
    instrument: null

  # ── PARIDYUM CYBER ──────────────────────────────────────────────────────────
  #
  # PARIDYUM owns this company and its Director drives it on paper (operator
  # decision, 2026-09-09). So Priyanshu is FIRST here as well -- signing for the
  # holding company rather than from an office he holds at Cyber -- and Ruhani's
  # own documents fall through to nobody until a second Cyber signatory exists.
  #
  # This is an operator decision about who acts, not a legal opinion about who
  # may bind an unincorporated company. RFC-0042 §3 takes the same posture.
  - id: cyber-holding
    company: PCY
    legal_name: PRIYANSHU SHARMA
    designation: Director, PARIDYUM -- for the holding company
    short: For PARIDYUM
    active: true
    appointed_on: null
    instrument: null

  - id: cyber-ceo
    company: PCY
    legal_name: RUHANI KHURANA
    designation: Chief Executive Officer (CEO)
    short: CEO
    active: true
    appointed_on: null
    instrument: null

  - id: cyber-cto
    company: PCY
    legal_name: ROHAN BATRA
    designation: Chief Technology Officer (CTO)
    short: CTO
    active: true
    appointed_on: null
    instrument: null

  # ── PARIDYUM MEDIA ──────────────────────────────────────────────────────────
  #
  # Appointed 2026-09-26 on operator direction. PMD had no signatory at all, so
  # `docket check` refused the whole registry: "PMD has no active signatory, so
  # nothing can be issued for it" (ADR-0077 decision 4). Nothing has ever been
  # issued under `PMD/...` — the register holds 0 entries — so this appointment
  # precedes the first document rather than repairing one.
  #
  # PRIYANSHU FIRST, SIGNING FOR THE HOLDING COMPANY, exactly as at Cyber.
  # ADR-0077 D4 resolves signing through the ownership relationship, and PMD is
  # `owned_by: PAR` in org.yaml. This is the same shape as `cyber-holding` and it
  # is deliberately the same shape: two subsidiaries whose documents route
  # differently for no stated reason is how a register stops being predictable.
  #
  # AND THE SAME POSTURE ON INCORPORATION. PMD is `legal_status: Incorporation
  # in Process` with `cin: null`, and the Cyber block above already settles what
  # an entry means in that state: "an operator decision about who acts, not a
  # legal opinion about who may bind an unincorporated company. RFC-0042 §3 takes
  # the same posture." Restated here because it is the objection a reader raises
  # at exactly this point, and the answer is nine lines up rather than obvious.
  #
  # ROHAN IS SECOND BECAUSE ONE ENTRY WOULD NOT HAVE BEEN ENOUGH, and that is a
  # property of the check rather than a preference: `countersignatories` counts
  # DISTINCT PEOPLE, not entries, because `docket issue` refuses a document whose
  # subject and signatory are the same person. With Priyanshu alone, PMD could
  # issue nothing to Priyanshu — the one officer hardest to route around. He is
  # already CTO at PAR and at PCY, so this invents no person and no new office.
  #
  # NO CEO ENTRY, deliberately. Cyber has one because Ruhani holds that office
  # there. Nobody holds a media office yet, and inventing a title to fill a
  # column is the fiction this register exists to keep out. ACADEMY IS EXPECTED
  # TO LEAVE (org.yaml, RFC-0052 D3) and will need its own; that is the moment to
  # appoint someone to it, not now.
  - id: media-holding
    company: PMD
    legal_name: PRIYANSHU SHARMA
    designation: Director, PARIDYUM -- for the holding company
    short: For PARIDYUM
    active: true
    appointed_on: null
    instrument: null

  - id: media-cto
    company: PMD
    legal_name: ROHAN BATRA
    designation: Chief Technology Officer (CTO)
    short: CTO
    active: true
    appointed_on: null
    instrument: null
